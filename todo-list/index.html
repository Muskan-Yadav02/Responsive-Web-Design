<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Styled To-Do List</title>
    <link rel = "stylesheet" href = "styles.css">
</head>

<body>
    <h1>TODO-LIST</h1>
    <ul class = "todo-list">
        <li>
            <input type = "checkbox" id = "list-item1">
            <label for = "list-item1">Morning Routine</label>
            <ul class = "sub-item">
                <li>
                    <a class = "sub-item-link" href = "https://play.google.com/store/apps/details?id=com.google.android.apps.kids.familylink&hl=en_IN" target = "_blank">Exercise Time</a>
                </li>
            </ul>
        </li>

        <li>
            <input type = "checkbox" id = "list-item2">
            <label for = "list-item2">Do Daily Task</label>
            <ul class = "sub-item">
                <li>
                    <a class = "sub-item-link" href = "https://play.google.com/store/apps/details?id=com.google.android.apps.kids.familylink&hl=en_IN" target = "_blank">Bathing, cleaning & other</a>
                </li>
            </ul>
        </li>
        
        <li>
            <input type = "checkbox" id = "list-item3">
            <label for = "list-item3">Break Time</label>
            <ul class = "sub-item">
                <li>
                    <a class = "sub-item-link" href = "https://play.google.com/store/apps/details?id=com.google.android.apps.kids.familylink&hl=en_IN" target = "_blank">Have Lunch </a>
                </li>
            </ul>
        </li>

        <li>
            <input type = "checkbox" id = "list-item4">
            <label for = "list-item4">Learning Time</label>
            <ul class = "sub-item">
                <li>
                    <a class = "sub-item-link" href = "https://play.google.com/store/apps/details?id=com.google.android.apps.kids.familylink&hl=en_IN" target = "_blank">Learn new Things</a>
                </li>
            </ul>
        </li>
    </ul>
</body>

</html>
