<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job Application</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="container">
    <form>
      <h1>Join Our Team</h1>
      <p>Tell us a little about yourself and the role you're interested in.</p>

      <div class="form-field">
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" placeholder="Enter your full name" required>
      </div>

      <div class="form-field">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required>
      </div>

      <div class="form-field">
        <label for="position">Position</label>
        <select id="position" name="position" required>
          <option value="">Choose a position</option>
          <option value="frontend">Frontend Developer</option>
          <option value="backend">Backend Developer</option>
          <option value="designer">UI/UX Designer</option>
          <option value="manager">Project Manager</option>
        </select>
      </div>

      <fieldset class="radio-group">
        <legend>Availability</legend>

        <div>
          <input type="radio" id="full-time" name="availability" value="full-time" required>
          <label for="full-time">Full-Time</label>
        </div>

        <div>
          <input type="radio" id="part-time" name="availability" value="part-time">
          <label for="part-time">Part-Time</label>
        </div>

        <div>
          <input type="radio" id="contract" name="availability" value="contract">
          <label for="contract">Contract</label>
        </div>
      </fieldset>

      <div class="form-field">
        <label for="message">Why should we hire you?</label>
        <textarea
          id="message"
          name="message"
          rows="6"
          placeholder="Tell us about your experience..."
          required
        ></textarea>
      </div>

      <button type="submit">Submit Application</button>
    </form>
  </div>

</body>
</html>
